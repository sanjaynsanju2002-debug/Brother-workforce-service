crons:
  - name: daily-digest
    description: "Emails yesterday's visits, job applications and manpower requests at 7am IST"
    cron: "0 7 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/digest"
    method: POST
    enabled: true
